name: H01a Tag Mode Proof
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Claude Code Action (tag mode — formatContext interpolates branch)
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: sk-ant-test-mock
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:18001
          ANTHROPIC_API_KEY: sk-ant-test-mock
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"

      - name: Dump claude-prompt.txt (formatContext with branch name)
        run: |
          echo "=== claude-prompt.txt ==="
          cat /home/runner/work/_temp/claude-prompts/claude-prompt.txt 2>/dev/null | head -60 || echo "FILE MISSING"
          echo
          echo "=== HIDDEN CHAR CHECK IN PROMPT FILE ==="
          python3 - << 'PYEOF'
          import sys
          try:
              data = open('/home/runner/work/_temp/claude-prompts/claude-prompt.txt', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              print("NO_FILE"); sys.exit(2)
          print("U+2060 (WORD JOINER) present:", chr(0x2060) in data)
          print("U+202F (NARROW NBSP) present:", chr(0x202F) in data)
          print("INJECT-CANARY present:", "INJECT-CANARY" in data)
          print("PR Branch lines:", [l for l in data.splitlines() if 'PR Branch' in l][:3])
          if chr(0x2060) in data or chr(0x202F) in data:
              print("VERDICT: LEAK — hidden chars survived into the model prompt")
          else:
              print("VERDICT: NO LEAK in prompt file")
          PYEOF
